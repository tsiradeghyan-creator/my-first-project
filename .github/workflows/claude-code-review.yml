name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run Claude code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'EOF'
          import os
          import subprocess
          import anthropic
          import urllib.request
          import json

          # Get the diff
          result = subprocess.run(
              ["git", "diff", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]],
              capture_output=True, text=True
          )
          diff = result.stdout

          if not diff.strip():
              print("No diff found, skipping review.")
              exit(0)

          # Truncate if too large (keep under ~150K chars)
          if len(diff) > 150_000:
              diff = diff[:150_000] + "\n\n[diff truncated due to size]"

          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])

          response = client.messages.create(
              model="claude-opus-4-6",
              max_tokens=4096,
              thinking={"type": "adaptive"},
              system=(
                  "You are an expert code reviewer. Analyze the provided git diff and give "
                  "a concise, constructive review. Focus on: bugs, security issues, "
                  "performance concerns, and code quality. Be specific and actionable. "
                  "Format your review in Markdown."
              ),
              messages=[
                  {
                      "role": "user",
                      "content": f"Please review the following pull request diff:\n\n```diff\n{diff}\n```"
                  }
              ]
          )

          review_text = next(
              (block.text for block in response.content if block.type == "text"),
              "No review generated."
          )

          comment_body = f"## Claude Code Review\n\n{review_text}"

          # Post comment to PR via GitHub API
          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]

          url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
          data = json.dumps({"body": comment_body}).encode()
          req = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as resp:
              print(f"Comment posted: HTTP {resp.status}")
          EOF
