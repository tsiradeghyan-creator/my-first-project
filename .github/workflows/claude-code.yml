name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Необходимо для чтения результатов CI на PR
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Запуск Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Необязательная настройка, позволяющая Claude читать результаты CI на PR
          additional_permissions: |
            actions: read

          # Необязательно: задать пользовательский промпт для Claude. Если не указан, Claude выполнит инструкции из комментария, в котором его упомянули.
          # prompt: 'Обновить описание pull request, добавив краткое содержание изменений.'

          # Необязательно: добавить claude_args для настройки поведения и конфигурации
          # См. https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # или https://code.claude.com/docs/en/cli-reference для доступных опций
          # claude_args: '--allowed-tools Bash(gh pr:*)'
