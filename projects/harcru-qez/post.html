<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --red:#D90429; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body { font-family:'Noto Serif Armenian', serif; }
  .post { position:relative; width:1080px; height:1350px; overflow:hidden; padding:96px 96px 90px; display:flex; flex-direction:column; }
  .dark  { background:#0A0A0A; color:#F4F1EC; --muted:rgba(244,241,236,.45); --ghost:rgba(244,241,236,.06); --rule:rgba(244,241,236,.25); }
  .light { background:#F4F1EC; color:#111111; --muted:rgba(17,17,17,.5);  --ghost:rgba(17,17,17,.06);  --rule:rgba(17,17,17,.25); }

  /* grain */
  .grain { position:absolute; inset:-50%; pointer-events:none; opacity:.09; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* ghost numeral */
  .num { position:absolute; right:-40px; bottom:150px; font-family:'Bodoni Moda', serif; font-style:italic; font-weight:400;
    font-size:760px; line-height:.8; color:transparent; -webkit-text-stroke:2px var(--ghost); letter-spacing:-30px;
    animation: drift 8s linear both, fade 1.6s ease-out both; }
  @keyframes drift { from { transform:translateY(40px) scale(1.04);} to { transform:translateY(-20px) scale(1);} }

  .top { display:flex; justify-content:space-between; align-items:center; font-family:'Noto Sans Armenian', sans-serif;
    font-size:22px; font-weight:500; letter-spacing:.42em; text-transform:uppercase; animation: fade 1s .1s ease-out both; }
  .top .count { color:var(--muted); letter-spacing:.3em; }
  .top .count b { color:var(--red); font-weight:500; }

  .body { flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; }

  .when { display:flex; align-items:center; gap:28px; margin-bottom:56px; }
  .when .line { height:2px; width:110px; background:var(--red); transform-origin:left; animation: draw .9s .35s cubic-bezier(.7,0,.2,1) both; }
  .when span { color:var(--red); font-weight:500; font-size:36px; letter-spacing:.04em; animation: slide .9s .6s cubic-bezier(.2,.7,.2,1) both; }
  .when span em { font-style:normal; color:var(--muted); font-weight:400; }

  .q { font-weight:300; line-height:1.18; letter-spacing:-.01em; }
  .q .w { display:inline-block; white-space:pre; animation: rise 1.1s cubic-bezier(.2,.75,.15,1) both; }
  .q .k { position:relative; color:var(--red); font-weight:400; }
  .q .k::after { content:''; position:absolute; left:2%; right:2%; bottom:-.14em; height:3px; background:var(--red);
    transform-origin:left; animation: draw .8s var(--kd) cubic-bezier(.7,0,.2,1) both; }

  .foot { position:relative; z-index:2; display:flex; justify-content:space-between; align-items:flex-end; padding-top:30px;
    border-top:1px solid var(--rule); animation: fade 1.2s var(--fd) ease-out both; }
  .foot .sig { font-family:'Bodoni Moda', serif; font-style:italic; font-size:34px; line-height:1.25; }
  .foot .sig i { color:var(--red); }
  .tri { width:0; height:0; border-left:13px solid transparent; border-right:13px solid transparent; border-bottom:22px solid var(--red); margin-bottom:10px; }

  @keyframes fade  { from { opacity:0; } to { opacity:1; } }
  @keyframes draw  { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes slide { from { opacity:0; transform:translateX(-30px); filter:blur(6px);} to { opacity:1; transform:none; filter:none; } }
  @keyframes rise  { from { opacity:0; transform:translateY(42px); filter:blur(12px);} to { opacity:1; transform:none; filter:none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const POSTS = [
  { when:'Ամեն առավոտ',
    q:'Ինչպե՞ս կարող եմ այս օրը դարձնել ավելի արդյունավետ և *հաճելի*։', size:88 },
  { when:'Յուրաքանչյուր գործողությունից առաջ',
    q:'Արդյո՞ք այն, ինչ անելու եմ, կտա այն *արդյունքը*, որը ցանկանում եմ։', size:84 },
  { when:'Ինչ-որ բան ձեռք բերելուց առաջ',
    q:'Արդյո՞ք այս ձեռքբերումն *արժե* այն ռեսուրսը, որ ծախսելու եմ։', size:86 },
  { when:'Երեկոյան՝ օրն ամփոփելիս',
    q:'Այսօրվա արարքներս ու խոսքերս՝ ինչո՞վ էի առաջնորդվում. ենթագիտակցությա՞մբ, թե՞ *գիտակցությամբ*։', size:74 },
  { when:'Ցանկացած արձագանքից առաջ',
    q:'Սա տեսակե՞տ է, թե՞ *փաստ*։', size:150 },
];
const i = Math.max(1, Math.min(5, +(new URLSearchParams(location.search).get('i') || 1)));
const p = POSTS[i-1];
const words = p.q.split(' ');
const start = 1.25, span = Math.min(2.8, 0.22 * words.length);
const step = span / words.length;
let kd = 0;
const html = words.map((w, n) => {
  const d = (start + n * step).toFixed(2);
  const key = w.includes('*');
  const clean = w.replace(/\*/g, '');
  if (key) {
    kd = (+d + 0.9).toFixed(2);
    const m = clean.match(/^(.*?)([։,.]*)$/);
    return `<span class="w" style="animation-delay:${d}s"><span class="k">${m[1]}</span>${m[2]}</span>`;
  }
  return `<span class="w" style="animation-delay:${d}s">${clean}</span>`;
}).join(' ');
const fd = (start + span + 1.2).toFixed(2);
document.getElementById('root').innerHTML = `
<div class="post ${i % 2 ? 'dark' : 'light'}" style="--kd:${kd}s; --fd:${fd}s">
  <div class="grain"></div>
  <div class="num">0${i}</div>
  <div class="top"><span>Հարցրու՛ քեզ</span><span class="count"><b>0${i}</b> / 05</span></div>
  <div class="body">
    <div class="when"><div class="line"></div><span>${p.when}</span></div>
    <div class="q" style="font-size:${p.size}px">${html}</div>
  </div>
  <div class="foot"><div class="sig">Life will never be the same,<br><i>life is changing!</i></div><div class="tri"></div></div>
</div>`;
</script>
</body>
</html>
