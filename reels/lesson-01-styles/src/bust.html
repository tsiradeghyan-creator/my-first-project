<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="1200" height="1400"></canvas>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setClearColor(0x000000,0); renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(28,1200/1400,0.1,100);
// procedural marble texture
function marbleTex(seed){const s=1024,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d');
 const img=g.createImageData(s,s);let r=seed;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};
 const P=[...Array(512)].map(()=>rnd());const noise=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const h=(a,b)=>P[(a*57+b*131)&511];const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v)+(h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v};
 for(let y=0;y<s;y++)for(let x=0;x<s;x++){let n=0,a=1,f=0.008;for(let o=0;o<5;o++){n+=noise(x*f,y*f)*a;a*=0.5;f*=2}
  const v=Math.abs(Math.sin((x*0.012+y*0.005+n*7)));const vein=Math.pow(v,0.09);const c=0.80+0.18*vein-0.06*n;const i=(y*s+x)*4;
  img.data[i]=Math.min(255,c*248);img.data[i+1]=Math.min(255,c*240);img.data[i+2]=Math.min(255,c*228);img.data[i+3]=255}
 g.putImageData(img,0,0);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t}
const mat=new THREE.MeshStandardMaterial({map:marbleTex(7),roughness:0.55,metalness:0.0});
scene.add(new THREE.HemisphereLight(0xfff4e6,0x6b5a48,0.9));
const key=new THREE.DirectionalLight(0xffe0b0,2.6);key.position.set(3,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xbfd8ff,1.6);rim.position.set(-5,2,-3);scene.add(rim);
let obj;
window.load=async(which)=>{ if(obj) scene.remove(obj);
 if(which==='lee'){const g=await new GLTFLoader().loadAsync('LeePerrySmith.glb');obj=g.scene;}
 else {obj=await new OBJLoader().loadAsync('WaltHead.obj');}
 obj.traverse(m=>{if(m.isMesh){m.material=mat;m.geometry.computeVertexNormals();}});
 const box=new THREE.Box3().setFromObject(obj);const c=box.getCenter(new THREE.Vector3());const sz=box.getSize(new THREE.Vector3()).length();
 obj.position.sub(c);const piv=new THREE.Group();piv.add(obj);scene.add(piv);obj=piv;window.sz=sz;return true};
window.shot=(yaw,pitch,dist)=>{obj.rotation.set(pitch,yaw,0);cam.position.set(0,0,window.sz*dist);cam.lookAt(0,0,0);renderer.render(scene,cam);return canvas.toDataURL('image/png')};
window.ready=true;
</script></body></html>
